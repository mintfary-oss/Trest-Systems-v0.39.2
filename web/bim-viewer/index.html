<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trest Systems BIM Viewer</title><style>html,body{margin:0;height:100%;overflow:hidden;font:14px system-ui;background:#0d1117;color:#e6edf3}header{height:52px;display:flex;align-items:center;gap:12px;padding:0 14px;background:#161b22;border-bottom:1px solid #30363d}main{height:calc(100% - 53px);display:flex}.side{width:310px;background:#11161d;border-right:1px solid #30363d;padding:12px;box-sizing:border-box;overflow:auto}.view{position:relative;flex:1}canvas{width:100%;height:100%;display:block}button,input{background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:7px}.row{display:flex;gap:6px;flex-wrap:wrap}.muted{color:#8b949e}.card{padding:9px;margin:8px 0;border:1px solid #30363d;border-radius:7px;background:#0d1117}.tree{font-size:13px}.node{padding:6px;border-radius:5px;cursor:pointer}.node:hover,.node.sel{background:#21262d}.node small{display:block;color:#8b949e}.indent{margin-left:14px}.kv{display:grid;grid-template-columns:95px 1fr;gap:5px;font-size:12px}.kv b{color:#8b949e}.badge{display:inline-block;padding:2px 6px;border:1px solid #30363d;border-radius:99px;font-size:11px}</style></head><body><header><b>Trest Systems · BIM Viewer</b><input id="file" type="file" accept=".gltf,.glb,.json"><button id="reset">Сбросить камеру</button><span id="status" class="muted">Ожидание модели</span></header><main><aside class="side"><b>Модель / элементы</b><div id="info" class="card muted">Загрузите GLTF/GLB и при необходимости semantic JSON с полем <code>elements</code>.</div><div id="tree" class="tree card"></div><b>Прогресс</b><div id="progress" class="card muted">Нет данных о прогрессе.</div><b>Свойства</b><div id="props" class="card muted">Выберите элемент в дереве.</div><b>Управление</b><div class="card muted">ЛКМ — вращение · Колесо — масштаб · ПКМ — панорамирование</div></aside><section class="view"><canvas id="c"></canvas></section></main><script>
const c=document.querySelector('#c'),gl=c.getContext('webgl');let prog,model=null,semantic=[],selected=null,progressData=null,manifest=null,angleX=.5,angleY=.7,dist=3,panX=0,panY=0,drag=null,last=[0,0];
function resize(){c.width=c.clientWidth*devicePixelRatio;c.height=c.clientHeight*devicePixelRatio;gl.viewport(0,0,c.width,c.height)}addEventListener('resize',resize);resize();
const vs=`attribute vec3 p;uniform mat4 mvp;void main(){gl_Position=mvp*vec4(p,1.0);}`;const fs=`precision mediump float;void main(){gl_FragColor=vec4(.34,.72,.96,1.0);}`;
function shader(t,s){let x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);return x}prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,vs));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(prog);gl.useProgram(prog);
function matMul(a,b){let o=new Float32Array(16);for(let r=0;r<4;r++)for(let col=0;col<4;col++)o[col*4+r]=a[r]*b[col*4]+a[4+r]*b[col*4+1]+a[8+r]*b[col*4+2]+a[12+r]*b[col*4+3];return o}function perspective(fov,asp,n,f){let q=1/Math.tan(fov/2),nf=1/(n-f);return new Float32Array([q/asp,0,0,0,0,q,0,0,0,0,(f+n)*nf,-1,0,0,2*f*n*nf,0])}
function render(){gl.enable(gl.DEPTH_TEST);gl.clearColor(.035,.05,.07,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);if(model){let ca=Math.cos(angleY),sa=Math.sin(angleY),cb=Math.cos(angleX),sb=Math.sin(angleX),view=new Float32Array([ca,sa*sb,sa*cb,0,0,cb,-sb,0,-sa,ca*sb,ca*cb,0,panX,panY,-dist,1]),mvp=matMul(perspective(1.0,c.width/c.height,.01,1000),view);gl.useProgram(prog);gl.uniformMatrix4fv(gl.getUniformLocation(prog,'mvp'),false,mvp);gl.bindBuffer(gl.ARRAY_BUFFER,model.buf);let loc=gl.getAttribLocation(prog,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,3,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,model.ib);gl.drawElements(gl.TRIANGLES,model.count,model.indexType||gl.UNSIGNED_SHORT,0)}requestAnimationFrame(render)}
function loadGLTF(g,externalBin=null){try{let prim=g.meshes?.[0]?.primitives?.[0];if(!prim)throw Error('mesh primitive не найден');let posAcc=g.accessors[prim.attributes.POSITION],idxAcc=g.accessors[prim.indices],pv=g.bufferViews[posAcc.bufferView],iv=g.bufferViews[idxAcc.bufferView];function uri(u){let comma=u.indexOf(',');let bin=atob(u.slice(comma+1)),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a.buffer}let bin=externalBin||uri(g.buffers[pv.buffer].uri),pOff=(pv.byteOffset||0)+(posAcc.byteOffset||0),iOff=(iv.byteOffset||0)+(idxAcc.byteOffset||0),pa=new Float32Array(bin,pOff,posAcc.count*3),ct=idxAcc.componentType,ib=ct===5121?new Uint8Array(bin,iOff,idxAcc.count):ct===5123?new Uint16Array(bin,iOff,idxAcc.count):ct===5125?new Uint32Array(bin,iOff,idxAcc.count):null;if(!ib)throw Error('Неподдерживаемый тип индексов');let b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(pa),gl.STATIC_DRAW);let e=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,e);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,ib,gl.STATIC_DRAW);model={buf:b,ib:e,count:ib.length,indexType:ct===5121?gl.UNSIGNED_BYTE:ct===5123?gl.UNSIGNED_SHORT:gl.UNSIGNED_INT,positions:new Float32Array(pa),indices:Uint32Array.from(ib)};document.querySelector('#info').textContent=`Вершин: ${posAcc.count} · треугольников: ${Math.floor(ib.length/3)} · ${externalBin?'GLB':'glTF'}`;document.querySelector('#status').textContent='Модель загружена';}catch(e){document.querySelector('#status').textContent='Ошибка: '+e.message}}
async function loadGLB(buf){let dv=new DataView(buf);if(new TextDecoder().decode(new Uint8Array(buf,0,4))!=='glTF'||dv.getUint32(4,true)!==2)throw Error('Неверный GLB 2.0');let len=dv.getUint32(8,true),off=12,json=null,bin=null;while(off+8<=len){let n=dv.getUint32(off,true),t=dv.getUint32(off+4,true);off+=8;if(off+n>len)throw Error('Повреждённый GLB chunk');let part=buf.slice(off,off+n);off+=n;if(t===0x4E4F534A)json=JSON.parse(new TextDecoder().decode(part));else if(t===0x004E4942)bin=part}if(!json||!bin)throw Error('GLB без JSON/BIN');loadGLTF(json,bin)}
function showProgress(){let p=document.querySelector('#progress');if(!progressData){p.textContent='Нет данных о прогрессе.';return}let plan=Number(progressData.planned_percent||0),actual=Number(progressData.actual_percent||0);p.innerHTML=`<div>План: <b>${plan.toFixed(1)}%</b></div><div style="height:8px;background:#21262d;border-radius:8px;margin:6px 0"><div style="height:8px;width:${Math.max(0,Math.min(100,plan))}%;background:#58a6ff;border-radius:8px"></div></div><div>Факт: <b>${actual.toFixed(1)}%</b></div><div style="height:8px;background:#21262d;border-radius:8px;margin:6px 0"><div style="height:8px;width:${Math.max(0,Math.min(100,actual))}%;background:#3fb950;border-radius:8px"></div></div>`}function showProps(e){selected=e;let p=e.properties||{};document.querySelector('#props').innerHTML=`<div class="kv"><b>Тип</b><span>${e.element_type||e.type||'—'}</span><b>GlobalId</b><span>${e.ifc_global_id||e.global_id||'—'}</span><b>ID</b><span>${e.external_id||e.id||'—'}</span><b>Родитель</b><span>${e.parent_external_id||'—'}</span></div><hr><pre style="white-space:pre-wrap;font-size:11px">${escapeHTML(JSON.stringify(p,null,2))}</pre>`}
function escapeHTML(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function renderTree(){let root=document.querySelector('#tree');root.innerHTML='';if(!semantic.length){root.innerHTML='<span class="muted">Semantic JSON не загружен.</span>';return}let byParent={};for(let e of semantic){let k=e.parent_external_id||'__root__';(byParent[k]??=[]).push(e)}function branch(parent,depth){for(let e of (byParent[parent]||[])){let d=document.createElement('div');d.className='node '+(selected===e?'sel':'');d.style.marginLeft=(depth*14)+'px';d.innerHTML=`<span>${e.name||e.element_type||e.type||e.external_id}</span><small>${e.element_type||e.type||''} <span class="badge">${e.ifc_global_id||e.external_id||''}</span></small>`;d.onclick=()=>{showProps(e);renderTree()};root.appendChild(d);branch(e.external_id,depth+1)}}branch('__root__',0)}
function pickTriangle(ev){if(!model||!manifest?.ranges?.length)return;const rect=c.getBoundingClientRect(),sx=(ev.clientX-rect.left)/rect.width*2-1,sy=1-(ev.clientY-rect.top)/rect.height*2;let best=-1,bestD=1e9;for(let i=0;i<model.indices.length;i+=3){let pts=[];for(let k=0;k<3;k++){let j=model.indices[i+k]*3;let x=model.positions[j],y=model.positions[j+1],z=model.positions[j+2];let d=Math.max(.01,dist),q=1/Math.tan(.5),asp=c.width/c.height;let zz=z-d,px=(q/asp*x)/Math.max(.01,-zz),py=(q*y)/Math.max(.01,-zz);pts.push([px,py]);}let [a,b,cc]=pts,den=(b[1]-cc[1])*(a[0]-cc[0])+(cc[0]-b[0])*(a[1]-cc[1]);if(Math.abs(den)<1e-8)continue;let u=((b[1]-cc[1])*(sx-cc[0])+(cc[0]-b[0])*(sy-cc[1]))/den,v=((cc[1]-a[1])*(sx-cc[0])+(a[0]-cc[0])*(sy-cc[1]))/den,w=1-u-v;if(u>=0&&v>=0&&w>=0){let dx=sx-(a[0]+b[0]+cc[0])/3,dy=sy-(a[1]+b[1]+cc[1])/3,dd=dx*dx+dy*dy;if(dd<bestD){bestD=dd;best=i;}}}if(best<0)return;let r=manifest.ranges.find(x=>best>=x.first_index&&best<x.first_index+x.index_count);if(!r)return;let e=semantic.find(x=>(x.external_id||x.id)===r.element_external_id);if(e)showProps(e);else showProps({external_id:r.element_external_id,ifc_global_id:r.ifc_global_id,name:r.element_external_id,element_type:'BIM element'});document.querySelector('#status').textContent='Выбран треугольник '+best+' → '+(r.ifc_global_id||r.element_external_id)}
file.onchange=async e=>{let f=e.target.files[0];if(!f)return;try{if(f.name.toLowerCase().endsWith('.glb'))await loadGLB(await f.arrayBuffer());else{let j=JSON.parse(await f.text());if(Array.isArray(j.elements)){semantic=j.elements;progressData=j.progress||null;manifest=j.mesh_manifest||j.manifest||null;renderTree();showProgress();document.querySelector('#status').textContent='Semantic модель загружена';if(j.geometry)loadGLTF(j.geometry);return}loadGLTF(j)}}catch(err){document.querySelector('#status').textContent='Ошибка: '+err.message}};reset.onclick=()=>{angleX=.5;angleY=.7;dist=3;panX=panY=0};c.onmousedown=e=>{drag=e.button;last=[e.clientX,e.clientY]};addEventListener('mouseup',()=>drag=null);addEventListener('mousemove',e=>{if(drag===null)return;let dx=e.clientX-last[0],dy=e.clientY-last[1];last=[e.clientX,e.clientY];if(drag===0){angleY+=dx*.01;angleX+=dy*.01}else if(drag===2){panX+=dx*.003;panY-=dy*.003}});c.onclick=pickTriangle;c.oncontextmenu=e=>e.preventDefault();c.onwheel=e=>{dist=Math.max(.1,Math.min(100,dist*(1+e.deltaY*.001)))};render();
</script></body></html>
