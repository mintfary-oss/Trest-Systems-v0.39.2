services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trest}
      POSTGRES_USER: ${POSTGRES_USER:-trest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-trest} -d ${POSTGRES_DB:-trest}
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - trest
  redis:
    image: redis:7-alpine
    command:
    - redis-server
    - --appendonly
    - 'yes'
    - --requirepass
    - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
    - trest
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
    - minio_data:/data
    ports:
    - 127.0.0.1:${MINIO_PORT:-9000}:9000
    - 127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001
    networks:
    - trest
  api:
    build:
      context: ..
      dockerfile: Dockerfile.api
      args:
        TARGETARCH: ${TARGETARCH:-amd64}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-trest}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-trest}?sslmode=disable
      MIGRATIONS_DIR: /app/migrations
      API_ADDR: :8080
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:8080/ready
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
    - trest
  worker:
    build:
      context: ..
      dockerfile: Dockerfile.worker
      args:
        TARGETARCH: ${TARGETARCH:-amd64}
    environment:
      WORKER_ADDR: :8090
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:8090/health
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - trest
  marketplace-api:
    build:
      context: ../magasin-777/services/evaluator
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-trest}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-trest}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@trest.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
    - trest
  web:
    build: ../magasin-777/frontend
    environment:
      NEXT_PUBLIC_API_URL: /marketplace-api
    depends_on:
      marketplace-api:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:3000/
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
    - trest
  ollama:
    image: ollama/ollama:latest
    volumes:
    - ollama_data:/root/.ollama
    ports:
    - 127.0.0.1:${OLLAMA_PORT:-11434}:11434
    healthcheck:
      test:
      - CMD
      - ollama
      - list
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
    - trest
  super-sistema-webui:
    image: ghcr.io/open-webui/open-webui:latest
    ports:
    - 127.0.0.1:${WEBUI_PORT:-3001}:8080
    volumes:
    - open_webui_data:/app/backend/data
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?set WEBUI_SECRET_KEY in .env}
      WEBUI_AUTH: ${WEBUI_AUTH:-false}
      DEFAULT_MODELS: ${DEFAULT_MODELS:-llama3.2:3b}
    depends_on:
      ollama:
        condition: service_healthy
    networks:
    - trest
  nginx:
    image: nginx:alpine
    volumes:
    - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      marketplace-api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks: &id001
    - trest
    expose:
    - '80'
  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
    - nginx
    ports:
    - ${HTTP_PORT:-80}:80
    - ${HTTPS_PORT:-443}:443
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://:80}
      ACME_EMAIL: ${ACME_EMAIL:-}
      UPSTREAM: nginx:80
    volumes:
    - ./generated/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    - caddy_data:/data
    - caddy_config:/config
    healthcheck:
      test:
      - CMD
      - caddy
      - version
      interval: 30s
      timeout: 10s
      retries: 3
    networks: *id001
volumes:
  postgres_data: null
  redis_data: null
  minio_data: null
  ollama_data: null
  open_webui_data: null
  caddy_data: {}
  caddy_config: {}
networks:
  trest:
    driver: bridge
