services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trest}
      POSTGRES_USER: ${POSTGRES_USER:-trest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-trest} -d ${POSTGRES_DB:-trest}
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - trest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  redis:
    image: redis:7-alpine
    command:
    - redis-server
    - --appendonly
    - 'yes'
    - --requirepass
    - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
    - trest
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
    - minio_data:/data
    ports:
    - 127.0.0.1:${MINIO_PORT:-9000}:9000
    - 127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001
    networks:
    - trest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:9000/minio/health/live
      interval: 15s
      timeout: 5s
      retries: 10
  api:
    build:
      context: ..
      dockerfile: Dockerfile.api
      args:
        TARGETARCH: ${TARGETARCH:-amd64}
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      MIGRATIONS_DIR: /app/migrations
      API_ADDR: :8080
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SKIP_API_MIGRATIONS: '1'
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:8080/ready
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
    - trest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: trest-api:0.39.2
  worker:
    build:
      context: ..
      dockerfile: Dockerfile.worker
      args:
        TARGETARCH: ${TARGETARCH:-amd64}
    environment:
      WORKER_ADDR: :8090
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:8090/health
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - trest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: trest-worker:0.39.2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  marketplace-api:
    build:
      context: ../magasin-777/services/evaluator
    environment:
      DATABASE_URL: ${MARKETPLACE_DATABASE_URL:?MARKETPLACE_DATABASE_URL is required}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@trest.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      MARKETPLACE_SCHEMA: marketplace
      CORS_ALLOW_ORIGINS: ${PUBLIC_URL:-http://localhost}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
    - trest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: trest-marketplace-api:0.39.2
    volumes:
    - marketplace_uploads:/app/static/uploads
  web:
    build: ../magasin-777/frontend
    environment:
      NEXT_PUBLIC_API_URL: /marketplace-api
      INTERNAL_API_URL: http://marketplace-api:8000
    depends_on:
      marketplace-api:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:3000/
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
    - trest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: trest-web:0.39.2
  ollama:
    image: ollama/ollama:latest
    volumes:
    - ollama_data:/root/.ollama
    ports:
    - 127.0.0.1:${OLLAMA_PORT:-11435}:11434
    healthcheck:
      test:
      - CMD
      - ollama
      - list
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
    - trest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  super-sistema-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.3
    ports:
    - 127.0.0.1:${WEBUI_PORT:-3001}:8080
    volumes:
    - open_webui_data:/app/backend/data
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?set WEBUI_SECRET_KEY in .env}
      WEBUI_AUTH: 'true'
      DEFAULT_MODELS: ${DEFAULT_MODELS:-llama3.2:3b}
      WEBUI_ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      WEBUI_ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD:?WEBUI_ADMIN_PASSWORD is required}
      ENABLE_SIGNUP: 'false'
      RAG_EMBEDDING_ENGINE: ollama
      RAG_EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      RAG_OLLAMA_BASE_URL: http://ollama:11434
      OFFLINE_MODE: 'true'
      HF_HUB_OFFLINE: '1'
      RAG_EMBEDDING_MODEL_AUTO_UPDATE: 'false'
      RAG_RERANKING_MODEL_AUTO_UPDATE: 'false'
      WHISPER_MODEL_AUTO_UPDATE: 'false'
      CORS_ALLOW_ORIGIN: http://localhost:3001;http://127.0.0.1:3001
      RESET_CONFIG_ON_START: 'false'
    depends_on:
      ollama:
        condition: service_healthy
    networks:
    - trest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import json,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=5);
        assert r.status==200 and json.load(r).get('status') is True
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 12
  nginx:
    image: nginx:alpine
    volumes:
    - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      marketplace-api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks: &id001
    - trest
    expose:
    - '80'
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://127.0.0.1/ready
      interval: 15s
      timeout: 5s
      retries: 10
  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
    - nginx
    ports:
    - ${HTTP_PORT:-80}:80
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://:80}
      ACME_EMAIL: ${ACME_EMAIL:-}
      UPSTREAM: nginx:80
    volumes:
    - ./generated/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    - caddy_data:/data
    - caddy_config:/config
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://127.0.0.1:8088/health
      interval: 15s
      timeout: 5s
      retries: 10
    networks: *id001
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  postgres_data: null
  redis_data: null
  minio_data: null
  ollama_data: null
  open_webui_data: null
  caddy_data: {}
  caddy_config: {}
  marketplace_uploads: {}
networks:
  trest:
    driver: bridge
